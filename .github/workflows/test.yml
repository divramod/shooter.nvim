name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        neovim_version: ['stable', 'nightly']

    steps:
      - uses: actions/checkout@v3

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim_version }}

      - name: Install plenary.nvim
        run: |
          mkdir -p ~/.local/share/nvim/site/pack/vendor/start
          git clone --depth 1 https://github.com/nvim-lua/plenary.nvim.git ~/.local/share/nvim/site/pack/vendor/start/plenary.nvim

      - name: Run tests
        run: |
          nvim --version
          TEST_OUTPUT=$(mktemp)
          timeout 120 nvim --headless --noplugin -u tests/minimal_init.lua \
            -c "lua require('plenary.test_harness').test_directory('tests/', {minimal_init = 'tests/minimal_init.lua', sequential = true})" 2>&1 | tee "$TEST_OUTPUT" || true
          # Check for actual test failures (not just nvim exit code)
          if grep -q "^Failed :.*[1-9]" "$TEST_OUTPUT"; then
            echo "Tests failed!"
            exit 1
          fi
          echo "All tests passed!"

      - name: Lint with luacheck (if available)
        run: |
          if command -v luacheck &> /dev/null; then
            luacheck lua/
          else
            echo "luacheck not installed, skipping"
          fi
        continue-on-error: true
