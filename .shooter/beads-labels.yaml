project:
  labels: []
  version: 1
shooter:
  allowed:
  - error:missing-validation
  - error:non-idempotent
  - error:regression
  - error:silent-failure
  - error:test-gap
  - fork:pr-created
  - fork:pr-merged
  - meta:concern
  - meta:history:code
  - meta:history:git
  - meta:history:github
  - meta:severity:high
  - meta:severity:low
  - meta:severity:medium
  - plan:autonomous:false
  - plan:autonomous:true
  - plan:gap-closure
  - plan:phase:1
  - plan:phase:2
  - plan:phase:3
  - plan:todo
  - plan:wave:1
  - plan:wave:2
  - plan:wave:3
  - plan:wave:4
  - plan:wave:5
  - theme:_project
  - type:epic
  - type:issue:bug
  - type:issue:chore
  - type:issue:feature
  - type:issue:shot
  - type:issue:task
  - type:theme
  deprecated:
  - autonomous:*
  - commits:*
  - concern
  - gap-closure
  - issue:*
  - marker:*
  - phase:*
  - pr:*
  - severity:*
  - todo
  - wave:*
  generated: true
  issue_types:
    bug:
      description: Defect to fix
      fields_optional:
      - acceptance
      fields_required:
      - title
      - description
      label: type:issue:bug
      parent: epic
    chore:
      description: Maintenance or housekeeping task
      fields_optional: []
      fields_required:
      - title
      label: type:issue:chore
      parent: epic
    epic:
      description: Body of work under a theme
      fields_optional:
      - acceptance
      - design
      - notes
      fields_required:
      - title
      - description
      label: type:epic
      parent: theme
    feature:
      description: New capability to add
      fields_optional:
      - acceptance
      fields_required:
      - title
      - description
      label: type:issue:feature
      parent: epic
    shot:
      description: Ad-hoc task from nvim shotfile
      fields_required:
      - title
      - description
      label: type:issue:shot
      parent: epic
    task:
      description: Planned work item
      fields_optional:
      - acceptance
      fields_required:
      - title
      - description
      label: type:issue:task
      parent: epic
    theme:
      description: Top-level project grouping
      fields_optional: []
      fields_required:
      - title
      label: type:theme
      parent: null
  note: "DO NOT EDIT this section \u2014 generated by sho_ensure-labels.sh"
  open_vocabulary:
  - meta:category:*
  priorities:
    0:
      description: Drop everything and fix now
      name: critical
    1:
      description: Must be done this sprint/wave
      name: high
    2:
      description: "Default priority \u2014 do when scheduled"
      name: medium
    3:
      description: Nice to have, do if time permits
      name: low
    4:
      description: Captured for future consideration
      name: backlog
  statuses:
    builtin:
    - blocked
    - closed
    - deferred
    - in_progress
    - open
    custom:
    - discussed
    - executing
    - planned
    - verifying
    epic_lifecycle:
    - open
    - discussed
    - planned
    - executing
    - verifying
    - closed
  version: 1
