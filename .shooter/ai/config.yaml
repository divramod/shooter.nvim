# Shooter AI configuration
# Location: .shooter/ai/config.yaml

model_profile: balanced

workflow_gates:
  research: true
  plan_check: true
  verify: true

# Version files to sync from .shooter/VERSION on every commit.
# Paths relative to repo root. Supported: .toml, .json
# Empty list = no per-commit sync (release auto-discovers instead).
version:
  files: []
    # - Cargo.toml
    # - package.json

# Model profiles for AI agent spawning.
# Each profile maps 4 stages to models.
# Stages: orchestrator (CLI model), planning (research/plan), execution (build/edit), verification (check/review)
# Agent-to-stage mapping:
#   planning:     sho-epic-researcher, sho-epic-planner
#   execution:    sho-executor, sho-codebase-mapper, sho-debugger, sho-history-interpreter, sho-history-context-writer
#   verification: sho-plan-checker, sho-verifier, sho-integration-checker
profiles:
  quality:
    orchestrator: opus
    planning: opus
    execution: sonnet
    verification: sonnet
    effort: high
  balanced:
    orchestrator: sonnet
    planning: sonnet
    execution: sonnet
    verification: haiku
    effort: medium
  budget:
    orchestrator: sonnet
    planning: haiku
    execution: haiku
    verification: haiku
    effort: low
