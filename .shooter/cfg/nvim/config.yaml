# Shooter.nvim project-local configuration
# Values here override the global config at ~/.config/shooter/nvim/config.yaml
file:
  first_shot_of_the_day:
    color_bg: "#e6d5b8"
    debounce_in_ms: 500
    color_fg: "#555555"
  open_shots:
    color_bg: "#ffb347"
    debounce_in_ms: 500
    color_fg: "#000000"
  closed_shots:
    color_bg: "#c8e6c9"
    debounce_in_ms: 2000
    color_fg: "#555555"
